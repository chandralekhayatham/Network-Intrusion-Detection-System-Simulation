<!doctype html><html><head><meta charset="utf-8"><title>Network IDS SOC Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>body{font-family:Arial;margin:0;background:#0b1220;color:#e5e7eb}header{padding:24px 5%;background:#111827}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:20px 5%}.card,.panel{background:#151f32;border:1px solid #29364e;border-radius:12px;padding:16px}.v{font-size:28px;font-weight:bold}.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:0 5% 30px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #29364e;text-align:left;font-size:13px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}</style>
</head><body><header><h1>🛡️ Network Intrusion Detection System</h1><div>Defensive synthetic traffic • SOC simulation • Hybrid IDS</div></header>
<div class="grid" id="cards"></div><div style="padding:0 5% 18px"><div class="panel"><h3>Detection Stack</h3><div id="ml">Checking ML evaluation...</div></div></div><div class="charts"><div class="panel"><h3>Alerts by Severity</h3><canvas id="sev"></canvas></div><div class="panel"><h3>Alert Types</h3><canvas id="types"></canvas></div><div class="panel"><h3>Protocols</h3><canvas id="protos"></canvas></div><div class="panel"><h3>Recent Alerts</h3><table><thead><tr><th>Time</th><th>Source</th><th>Alert</th><th>Severity</th><th>Risk</th><th>Status</th></tr></thead><tbody id="alerts"></tbody></table></div></div>
<script>
const get=u=>fetch(u).then(r=>r.json());const bar=(id,l,d)=>new Chart(document.getElementById(id),{type:'bar',data:{labels:l,datasets:[{data:d}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
async function load(){let s=await get('/api/dashboard/stats');document.getElementById('cards').innerHTML=[['Total Flows',s.total_flows],['Normal',s.normal_traffic],['Suspicious',s.suspicious_traffic],['Open Alerts',s.open_alerts],['Critical',s.critical_alerts],['Avg Risk',s.average_risk],['Open Incidents',s.open_incidents]].map(x=>`<div class="card"><div>${x[0]}</div><div class="v">${x[1]}</div></div>`).join('');
let a=await get('/api/dashboard/alerts');bar('sev',a.severity.map(x=>x.severity),a.severity.map(x=>x.count));bar('types',a.types.map(x=>x.alert_type),a.types.map(x=>x.count));bar('protos',a.protocols.map(x=>x.protocol),a.protocols.map(x=>x.count));
let ml=document.getElementById('ml'); try{let m=await get('/api/ml/metrics'); ml.innerHTML=`Random Forest: Accuracy ${Number(m.accuracy*100).toFixed(1)}% • Precision ${Number(m.precision*100).toFixed(1)}% • Recall ${Number(m.recall*100).toFixed(1)}% • F1 ${Number(m.f1*100).toFixed(1)}%`;}catch(e){ml.innerHTML='ML enrichment not trained yet. Run: python ml/train_model.py';} let al=await get('/api/alerts');document.getElementById('alerts').innerHTML=al.map(x=>`<tr><td>${x.created_at}</td><td>${x.source_ip}</td><td>${x.alert_type}</td><td>${x.severity}</td><td>${Number(x.risk).toFixed(1)}</td><td>${x.status}</td></tr>`).join('')}
load();setInterval(load,5000);
</script></body></html>
